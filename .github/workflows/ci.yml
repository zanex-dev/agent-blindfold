name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-e2e-tests:
    name: E2E Guard & Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Unix scripts are executable and LF-clean
        if: runner.os != 'Windows'
        run: |
          chmod +x ./scripts/guard.sh ./scripts/session_start.sh ./scripts/unlock.sh ./install.sh
          for f in ./scripts/guard.sh ./scripts/session_start.sh ./scripts/unlock.sh ./install.sh; do
            file "$f" | grep -v "CRLF"
          done

      - name: Run Cross-Platform Security & Installer Test Suite
        run: python tests/run_tests.py
