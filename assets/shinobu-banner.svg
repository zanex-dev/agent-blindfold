<svg viewBox="0 0 900 250" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="55%" stop-color="#10141f"/>
      <stop offset="100%" stop-color="#181115"/>
    </linearGradient>
    <linearGradient id="eclipseRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="72%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="92%" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yellowLens" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="goldFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="katana" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ef4444" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="leftClip">
      <path d="M 76,118 C 92,113 136,113 154,119 C 162,122 163,138 156,156 C 147,178 118,188 96,180 C 74,172 64,146 69,126 C 70,121 73,119 76,118 Z"/>
    </clipPath>
    <clipPath id="rightClip">
      <path d="M 186,119 C 204,113 248,113 264,118 C 267,119 270,121 271,126 C 276,146 266,172 244,180 C 222,188 193,178 184,156 C 177,138 178,122 186,119 Z"/>
    </clipPath>
    <mask id="biteMask">
      <rect width="900" height="250" fill="white"/>
      <circle cx="170" cy="122" r="24" fill="black"/>
      <circle cx="218" cy="74" r="22" fill="black"/>
      <circle cx="233" cy="94" r="17" fill="black"/>
    </mask>
  </defs>

  <rect width="900" height="250" rx="10" fill="url(#bg)"/>
  <line x1="30" y1="215" x2="860" y2="38" stroke="url(#katana)" stroke-width="2"/>

  <!-- 外围精密罗盘刻度环 + 四向锁扣准星 -->
  <circle cx="170" cy="122" r="82" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 6" opacity="0.65"/>
  <circle cx="170" cy="122" r="76" fill="none" stroke="url(#eclipseRing)" stroke-width="1.5" stroke-dasharray="45 14 20 14" opacity="0.75"/>
  <path d="M 170,34 L 170,44 M 170,200 L 170,210 M 82,122 L 92,122 M 248,122 L 258,122" stroke="#fde047" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- 日食光晕甜甜圈 -->
  <g mask="url(#biteMask)">
    <circle cx="170" cy="122" r="66" fill="url(#innerGlow)"/>
    <circle cx="170" cy="122" r="65" fill="none" stroke="url(#eclipseRing)" stroke-width="2.5"/>
    <circle cx="170" cy="122" r="24" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- 0.54x 精致内嵌蛤蟆镜与吸血鬼金瞳 -->
  <g transform="translate(170, 134) rotate(-6) scale(0.54) translate(-170, -148)">
    <path d="M 96,142 Q 114,132 132,143" fill="none" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <ellipse cx="114" cy="146" rx="12" ry="8" fill="#fef08a" opacity="0.48"/>
    <ellipse cx="114" cy="146" rx="2.8" ry="7.2" fill="#dc2626" opacity="0.95"/>
    <circle cx="118" cy="142" r="2.2" fill="#ffffff" opacity="0.9"/>

    <path d="M 208,143 Q 226,132 244,142" fill="none" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <ellipse cx="226" cy="146" rx="12" ry="8" fill="#fef08a" opacity="0.48"/>
    <ellipse cx="226" cy="146" rx="2.8" ry="7.2" fill="#dc2626" opacity="0.95"/>
    <circle cx="230" cy="142" r="2.2" fill="#ffffff" opacity="0.9"/>

    <path d="M 68,124 L 48,110 M 272,124 L 292,110" stroke="url(#goldFrame)" stroke-width="2.8" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="161" cy="138" rx="2.5" ry="5" transform="rotate(-15 161 138)" fill="#fde047"/>
    <ellipse cx="179" cy="138" rx="2.5" ry="5" transform="rotate(15 179 138)" fill="#fde047"/>

    <path d="M 76,118 C 92,113 136,113 154,119 C 162,122 163,138 156,156 C 147,178 118,188 96,180 C 74,172 64,146 69,126 C 70,121 73,119 76,118 Z" fill="url(#yellowLens)" stroke="url(#goldFrame)" stroke-width="3.4"/>
    <g clip-path="url(#leftClip)">
      <polygon points="72,105 98,105 68,190 42,190" fill="url(#shine)"/>
    </g>

    <path d="M 186,119 C 204,113 248,113 264,118 C 267,119 270,121 271,126 C 276,146 266,172 244,180 C 222,188 193,178 184,156 C 177,138 178,122 186,119 Z" fill="url(#yellowLens)" stroke="url(#goldFrame)" stroke-width="3.4"/>
    <g clip-path="url(#rightClip)">
      <polygon points="192,105 218,105 188,190 162,190" fill="url(#shine)"/>
      <text x="228" y="172" fill="#fef08a" font-family="monospace" font-size="11" font-weight="bold">DENY:403</text>
    </g>

    <line x1="126" y1="114" x2="214" y2="114" stroke="url(#goldFrame)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 157,125 Q 170,119 183,125" fill="none" stroke="url(#goldFrame)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 右侧标题排版 -->
  <text x="290" y="72" fill="#fde047" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">PRE-TOOL-USE PRIVACY &amp; ANTI-BAN SHIELD</text>
  <text x="290" y="130" fill="#ffffff" font-family="-apple-system,Segoe UI,sans-serif" font-size="46" font-weight="800">agent-blindfold</text>
  <text x="290" y="166" fill="#9ca3af" font-family="-apple-system,Segoe UI,sans-serif" font-size="15.5" font-style="italic">"Keep your AI Agent's eyes on the code, not on your private stash."</text>
  <rect x="290" y="186" width="445" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="304" y="205" fill="#fde047" font-family="monospace" font-size="12.5">🗡️ Codename: Heart-Under-Blade (刃下心) · Crafted by 琢玹 (zanex)</text>
</svg>
